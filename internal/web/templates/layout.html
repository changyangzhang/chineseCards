{{define "layout"}}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{block "title" .}}Chinese Cards{{end}}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<script>
    // Mandarin text-to-speech, shared across all pages that render a
    // speaker button (review ribbon, choice icons, word-of-the-day).
    // Uses the browser's Web Speech API — free, on-device — so nothing
    // is ever sent to a server. Cloze blanks become natural pauses.
    function speakChinese(text) {
        if (!('speechSynthesis' in window) || !text) return;
        speechSynthesis.cancel();
        var cleaned = text.replace(/_+/g, ', ');
        var utter = new SpeechSynthesisUtterance(cleaned);
        utter.lang = 'zh-CN';
        utter.rate = 0.9;
        speechSynthesis.speak(utter);
    }
    // Delegate speaker-button clicks so any element with .speak-btn or
    // .speak-icon (and a data-text attribute) plays automatically.
    document.addEventListener('click', function (e) {
        var trigger = e.target.closest('.speak-btn, .speak-icon');
        if (!trigger) return;
        e.preventDefault();
        e.stopPropagation();
        speakChinese(trigger.dataset.text);
    }, true);
</script>
<header>
    <nav>
        <a href="/" class="brand">🇨🇳 Chinese Cards</a>
        <span class="spacer"></span>
        <a href="/review">Review</a>
        <a href="/chat">Chat</a>
        <a href="/import">Import</a>
        <a href="/cards">Cards</a>
        <a href="/stats">Stats</a>
        <a href="/settings">Settings</a>
        {{if auth_enabled}}
        <form method="post" action="/logout" class="nav-logout">
            <button type="submit" class="nav-logout-btn" title="Log out">Logout</button>
        </form>
        {{end}}
    </nav>
</header>
<main>
    {{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
